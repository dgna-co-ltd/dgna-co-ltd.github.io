
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiểm Tra — Data Governance L1-01 | DGNA</title>
  <meta name="description" content="Bộ câu hỏi trắc nghiệm sau buổi học Data Governance là gì & Tại sao DG quan trọng — Module L1-01 DGNA.VN" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #f0b429;
      --gold-dim: #c8911a;
      --gold-glow: rgba(240,180,41,0.18);
      --green: #4caf7d;
      --red: #e8445a;
      --bg: #0e0e0e;
      --card: #161616;
      --surface: #1f1f1f;
      --border: rgba(240,180,41,0.18);
      --text: #f0ece0;
      --muted: #7a7570;
      --dim: #4a4640;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 30% 20%, #1a1500 0%, #0e0e0e 55%, #050505 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Be Vietnam Pro', Arial, sans-serif;
      padding: 20px 16px;
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 660px;
      background: var(--card);
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 0 80px rgba(240,180,41,0.06), 0 24px 48px rgba(0,0,0,0.7);
      padding: 28px 28px 24px;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: #1e1a0e;
      border: 1px solid rgba(240,180,41,0.2);
      border-radius: 12px;
      padding: 10px 14px;
    }
    .module-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .counter {
      font-size: 13px;
      color: #f0b429;
      font-weight: 700;
      background: rgba(240,180,41,0.12);
      border: 1px solid rgba(240,180,41,0.25);
      border-radius: 6px;
      padding: 3px 10px;
    }

    /* PROGRESS */
    .progress-track {
      height: 3px;
      background: rgba(255,255,255,0.05);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold));
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    .score-chip {
      font-size: 12px;
      color: #7a7060;
      margin-bottom: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      padding: 6px 12px;
      display: inline-block;
    }
    .score-chip span { color: var(--gold); font-weight: 700; }

    /* QUESTION */
    .question-block {
      display: flex;
      gap: 0;
      align-items: stretch;
      margin-bottom: 16px;
      background: rgba(240,180,41,0.05);
      border: 1px solid rgba(240,180,41,0.15);
      border-radius: 14px;
      overflow: hidden;
    }
    .q-num-large {
      font-size: 28px;
      font-weight: 900;
      color: var(--gold);
      line-height: 1;
      min-width: 52px;
      letter-spacing: -1px;
      background: rgba(240,180,41,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 10px;
      border-right: 1px solid rgba(240,180,41,0.12);
      flex-shrink: 0;
    }
    .question-text {
      font-size: 15px;
      color: #f5f0e8;
      line-height: 1.65;
      font-weight: 600;
      padding: 16px 16px;
    }

    /* OPTIONS */
    .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }

    .opt-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      text-align: left;
      background: #242420;
      border: 1px solid rgba(255,255,255,0.09);
      color: #d8d0c0;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
      line-height: 1.5;
      width: 100%;
    }
    .opt-btn:hover:not(:disabled) {
      background: #2e2c20;
      border-color: rgba(240,180,41,0.45);
      color: #f5f0e8;
    }
    .opt-btn:disabled { cursor: default; }
    .opt-btn.selected {
      background: #2e2a14;
      border-color: var(--gold);
      color: #fff8d0;
    }
    .opt-btn.correct {
      background: #162820;
      border-color: var(--green);
      color: #c8ffe0;
    }
    .opt-btn.wrong {
      background: #2a1218;
      border-color: var(--red);
      color: #ffd0d8;
    }

    .opt-label {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
      background: rgba(255,255,255,0.08);
      color: #807060;
      transition: all 0.2s;
    }
    .opt-btn.selected .opt-label { background: var(--gold); color: #1a1200; }
    .opt-btn.correct .opt-label  { background: var(--green); color: #001a0d; }
    .opt-btn.wrong .opt-label    { background: var(--red); color: #fff; }

    /* EXPLANATION */
    .explanation {
      display: flex;
      gap: 10px;
      background: #1e1c14;
      border: 1px solid rgba(240,180,41,0.2);
      border-left: 3px solid var(--gold);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 16px;
      align-items: flex-start;
      animation: fadeIn 0.3s ease;
    }
    .exp-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .exp-text  { font-size: 13px; color: #c8b888; line-height: 1.65; }

    @keyframes fadeIn { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform:none; } }

    /* ACTION */
    .action-row { display: flex; justify-content: flex-end; }
    .action-btn {
      background: #2a2010;
      color: var(--gold);
      border: 1.5px solid var(--gold);
      border-radius: 12px;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: all 0.2s;
    }
    .action-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      background: #1a1a1a;
      border-color: #444;
      color: #555;
    }
    .action-btn.next {
      background: linear-gradient(135deg, var(--gold), var(--gold-dim));
      color: #1a1000;
      border-color: transparent;
    }
    .action-btn:not(:disabled):hover { opacity: 0.88; }
    .action-btn:not(:disabled):active { transform: scale(0.97); }

    /* opt-label text color fix after state change */
    .opt-btn:not(.selected):not(.correct):not(.wrong) .opt-label { color: #a09080; }

    /* RESULT SCREEN */
    .result-badge { text-align: center; margin-bottom: 12px; font-size: 56px; line-height: 1; }
    .result-title { text-align: center; color: var(--text); font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .score-big { text-align: center; font-size: 64px; font-weight: 900; letter-spacing: -3px; line-height: 1; margin-bottom: 12px; }
    .grade-tag {
      display: block;
      margin: 0 auto 24px;
      padding: 6px 20px;
      border-radius: 99px;
      border: 1px solid;
      font-size: 13px;
      font-weight: 700;
      width: fit-content;
      text-align: center;
    }
    .result-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
    .dot-cell {
      width: 34px; height: 34px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; color: #111;
    }
    .result-actions { display: flex; gap: 12px; justify-content: center; margin-bottom: 16px; }
    .review-btn {
      background: var(--surface);
      color: #c8c0b0;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 11px 22px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .restart-btn {
      background: linear-gradient(135deg, var(--gold), var(--gold-dim));
      color: #1a1200; border: none; border-radius: 12px;
      padding: 11px 22px; font-size: 14px; font-weight: 800; cursor: pointer;
    }
    .module-tag { text-align: center; font-size: 11px; color: #333028; letter-spacing: 0.1em; }

    /* REVIEW SCREEN */
    .review-header {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 14px;
    }
    .back-btn {
      background: transparent; border: none; color: var(--gold);
      font-size: 13px; font-weight: 700; cursor: pointer; padding: 0;
    }
    .review-title { color: var(--text); font-weight: 700; font-size: 15px; }
    .review-scroll { overflow-y: auto; max-height: 68vh; padding-right: 4px; }
    .review-item {
      margin-bottom: 22px; padding-bottom: 22px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .review-q {
      display: flex; gap: 10px; align-items: flex-start;
      color: #f0ece0; font-size: 14px; font-weight: 600;
      margin-bottom: 10px; line-height: 1.55;
      background: rgba(240,180,41,0.05);
      border: 1px solid rgba(240,180,41,0.1);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .r-num {
      width: 24px; height: 24px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; color: #111; flex-shrink: 0; margin-top: 1px;
    }
    .review-opt {
      font-size: 13px; padding: 7px 10px; border-radius: 8px;
      margin-bottom: 4px; line-height: 1.5; border: 1px solid transparent;
      margin-left: 34px; color: #686058;
    }
    .review-exp {
      font-size: 12px; color: #806840; margin-top: 8px;
      line-height: 1.6; font-style: italic; margin-left: 34px;
      background: #1e1c14;
      border-left: 2px solid rgba(240,180,41,0.3);
      padding: 6px 10px;
      border-radius: 0 6px 6px 0;
    }

    /* HIDDEN SCREENS */
    .screen { display: none; }
    .screen.active { display: block; }

    @media (max-width: 480px) {
      .card { padding: 20px 16px 18px; }
      .q-num-large { font-size: 28px; min-width: 36px; }
      .question-text { font-size: 14px; }
      .score-big { font-size: 48px; }
    }
  </style>
</head>
<body>
<div class="card">

  <!-- QUIZ SCREEN -->
  <div id="screen-quiz" class="screen active">
    <div class="header">
      <div class="module-label">Data Governance · L1-01</div>
      <div class="counter" id="counter">1 / 15</div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <div class="score-chip"><span id="score-live">0</span> đúng</div>

    <div class="question-block">
      <div class="q-num-large" id="q-num">01</div>
      <div class="question-text" id="q-text"></div>
    </div>

    <div class="options" id="options"></div>

    <div id="explanation-box" class="explanation" style="display:none">
      <div class="exp-icon" id="exp-icon"></div>
      <div class="exp-text" id="exp-text"></div>
    </div>

    <div class="action-row">
      <button class="action-btn" id="action-btn" disabled>Xác nhận</button>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="screen-result" class="screen">
    <div class="result-badge" id="result-emoji"></div>
    <div class="result-title">Kết quả kiểm tra</div>
    <div class="score-big" id="result-score"></div>
    <div class="grade-tag" id="grade-tag"></div>
    <div class="result-grid" id="result-grid"></div>
    <div class="result-actions">
      <button class="review-btn" onclick="showReview()">Xem lại đáp án</button>
      <button class="restart-btn" onclick="restart()">Làm lại</button>
    </div>
    <div class="module-tag">Module L1-01 · DGNA.VN</div>
  </div>

  <!-- REVIEW SCREEN -->
  <div id="screen-review" class="screen">
    <div class="review-header">
      <button class="back-btn" onclick="backToResult()">← Kết quả</button>
      <div class="review-title">Xem lại đáp án</div>
    </div>
    <div class="review-scroll" id="review-content"></div>
  </div>

</div>

<script>
const questions = [
  {
    q: "Theo DAMA-DMBOK, Data Governance được định nghĩa là gì?",
    opts: [
      "Hệ thống phần mềm lưu trữ và xử lý dữ liệu doanh nghiệp",
      "Việc thực thi quyền lực, kiểm soát và ra quyết định chung về quản lý tài sản dữ liệu",
      "Bộ phận IT chịu trách nhiệm bảo mật và sao lưu dữ liệu",
      "Quy trình thu thập và phân tích dữ liệu phục vụ báo cáo"
    ],
    correct: 1,
    exp: "DAMA-DMBOK định nghĩa: Data Governance là việc thực thi quyền lực, kiểm soát và ra quyết định chung (lập kế hoạch, giám sát và thực thi) về quản lý tài sản dữ liệu."
  },
  {
    q: "3 trụ cột cốt lõi của Data Governance theo DAMA-DMBOK là gì?",
    opts: [
      "Công nghệ – Con người – Quy trình",
      "Lập kế hoạch – Thực thi – Báo cáo",
      "Quyền quyết định – Trách nhiệm giải trình – Quy tắc & Chuẩn mực",
      "Bảo mật – Chất lượng – Tích hợp"
    ],
    correct: 2,
    exp: "Ba trụ cột cốt lõi: (1) Quyền quyết định — ai có quyền quyết định về dữ liệu; (2) Trách nhiệm giải trình — ai chịu trách nhiệm khi dữ liệu sai; (3) Quy tắc & Chuẩn mực — chính sách và tiêu chuẩn quản lý dữ liệu."
  },
  {
    q: "Trong ví dụ ngân hàng có 3 định nghĩa khác nhau cho 'khách hàng', hậu quả trực tiếp là gì?",
    opts: [
      "Hệ thống bị tấn công bảo mật nghiêm trọng",
      "Báo cáo tăng trưởng khách hàng sai lệch 23% giữa các phòng ban",
      "Mất 3 ngày mỗi tháng để đối soát dữ liệu",
      "Dự án AI bị đình trệ toàn bộ"
    ],
    correct: 1,
    exp: "Do mỗi phòng ban dùng một định nghĩa khác nhau cho 'khách hàng', báo cáo tăng trưởng sai lệch tới 23% giữa các phòng ban — minh chứng điển hình của việc thiếu Business Glossary thống nhất."
  },
  {
    q: "DCAM khác với DAMA-DMBOK ở điểm nào?",
    opts: [
      "DCAM tập trung vào kiến trúc kỹ thuật, DAMA-DMBOK tập trung vào quy trình",
      "DCAM là tiêu chuẩn đánh giá mức độ trưởng thành dữ liệu, DAMA-DMBOK là framework lý thuyết tổng quát",
      "DCAM chỉ áp dụng cho ngân hàng, DAMA-DMBOK áp dụng cho mọi ngành",
      "DCAM là công cụ miễn phí, DAMA-DMBOK phải trả phí"
    ],
    correct: 1,
    exp: "DAMA-DMBOK là framework lý thuyết tổng quát về quản lý dữ liệu, còn DCAM là 'thước đo' thực tế — tập trung vào đánh giá mức độ trưởng thành dữ liệu và lộ trình cải thiện."
  },
  {
    q: "TOGAF có vai trò gì trong quản trị dữ liệu?",
    opts: [
      "Công cụ đo chất lượng dữ liệu theo từng trường dữ liệu",
      "Khung kiến trúc tổng thể, kết nối Dữ liệu – Công nghệ – Nghiệp vụ",
      "Bộ tiêu chuẩn bảo mật và mã hóa dữ liệu cá nhân",
      "Phương pháp luận tư vấn dữ liệu theo mô hình ROI"
    ],
    correct: 1,
    exp: "TOGAF là khung kiến trúc thượng tầng, kết nối Dữ liệu – Công nghệ – Nghiệp vụ, giúp thấy bức tranh lớn: hạ tầng hiện tại đã đủ để kết nối dữ liệu liên ngành chưa."
  },
  {
    q: "Key Insight quan trọng nhất về vai trò của Data Governance trong DAMA-DMBOK là gì?",
    opts: [
      "Governance sở hữu toàn bộ dữ liệu của tổ chức",
      "Governance chỉ phụ trách báo cáo và compliance",
      "Governance không 'sở hữu' dữ liệu — Governance hướng dẫn và điều phối cách dữ liệu được làm việc",
      "Governance là bộ phận IT chuyên trách phân quyền hệ thống"
    ],
    correct: 2,
    exp: "Insight cốt lõi: Governance KHÔNG sở hữu dữ liệu mà hướng dẫn và điều phối cách dữ liệu được làm việc — đây là điểm phân biệt quan trọng giữa Data Governance và Data Management."
  },
  {
    q: "Khung năng lực dữ liệu (Data Capability Landscape) gồm mấy tầng chiến lược?",

      "2 tầng: Chiến lược và Vận hành",
      "3 tầng: Chiến lược (Quản trị) – Chiến thuật (Quản lý) – Vận hành (Nền tảng)",
      "4 tầng: Hoạch định – Thiết kế – Vận hành – Đánh giá",
      "5 tầng theo mô hình trưởng thành DCAM"
    ],
    correct: 1,
    exp: "Khung năng lực dữ liệu gồm 3 tầng: (1) Chiến lược — Quản trị dữ liệu; (2) Chiến thuật — Quản lý dữ liệu; (3) Vận hành — Nền tảng dữ liệu và Vòng đời dữ liệu."
  },
  {
    q: "Theo Gartner, bao nhiêu % chương trình Data Governance sẽ thất bại đến năm 2027?",
    opts: ["50%", "65%", "80%", "90%"],
    correct: 2,
    exp: "Gartner cảnh báo 80% chương trình governance sẽ thất bại đến 2027 — không phải do công nghệ, mà do tổ chức không duy trì được tỷ lệ áp dụng (Adoption rate)."
  },
  {
    q: "Ba trụ cột giá trị kinh doanh của Data Governance là gì?",
    opts: [
      "Bảo mật – Tuân thủ – Tích hợp",
      "Doanh thu ↑ – Chi phí ↓ – Rủi ro ↓",
      "Công nghệ – Con người – Quy trình",
      "Tốc độ – Độ chính xác – Khả năng mở rộng"
    ],
    correct: 1,
    exp: "Ba trụ cột giá trị: Doanh thu tăng (quyết định nhanh hơn, AI/ML hiệu quả hơn), Chi phí giảm (ít reconcile, ít làm lại), Rủi ro giảm (ít vi phạm tuân thủ, ít sự cố bảo mật)."
  },
  {
    q: "Trong case study ngân hàng thương mại sau 12 tháng triển khai DG, thời gian reconcile giảm như thế nào?",
    opts: [
      "Từ 5 ngày xuống còn 1 ngày",
      "Từ 3 ngày xuống còn 4 giờ",
      "Từ 1 tuần xuống còn 2 ngày",
      "Từ 2 ngày xuống còn 30 phút"
    ],
    correct: 1,
    exp: "Sau 12 tháng triển khai DG, thời gian reconcile giảm từ 3 ngày xuống còn 4 giờ — tiết kiệm 2.500 giờ/năm."
  },
  {
    q: "Mô hình Data Driven với 4 trải nghiệm bao gồm những thành phần nào?",
    opts: [
      "BX (Business) – DX (Data) – CX (Customer) – PX (People)",
      "BX (Business) – DX (Digital) – CX (Cloud) – PX (Platform)",
      "AX (Architecture) – DX (Data) – CX (Customer) – TX (Technology)",
      "GX (Governance) – DX (Data) – CX (Compliance) – PX (Policy)"
    ],
    correct: 0,
    exp: "4 trải nghiệm cần kiện toàn đồng bộ: BX (Business eXperience) – DX (Data eXperience) – CX (Customer eXperience) – PX (People eXperience)."
  },
  {
    q: "Mức phạt tối đa theo Luật Bảo vệ Dữ liệu Cá nhân Việt Nam là bao nhiêu?",
    opts: [
      "1% doanh thu hoặc tối đa 500 triệu VND",
      "3% doanh thu hoặc tối đa 1 tỷ VND",
      "5% doanh thu năm trước hoặc 3 tỷ VND (hoặc 10 lần doanh thu từ vi phạm)",
      "10% doanh thu hoặc tối đa 5 tỷ VND"
    ],
    correct: 2,
    exp: "Luật BVDLCN Việt Nam: phạt đến 10 lần doanh thu từ vi phạm hoặc 3 tỷ VND. Vi phạm chuyển giao dữ liệu ra nước ngoài phạt đến 5% doanh thu năm trước."
  },
  {
    q: "Luật Dữ liệu Việt Nam (Luật số 60/2024/QH15) được Quốc hội thông qua vào ngày nào?",
    opts: ["15/08/2024", "30/11/2024", "26/06/2025", "01/01/2025"],
    correct: 1,
    exp: "Luật số 60/2024/QH15 (Luật Dữ liệu) được Quốc hội thông qua ngày 30/11/2024. Luật Bảo vệ Dữ liệu Cá nhân (91/2025/QH15) được thông qua ngày 26/06/2025."
  },
  {
    q: "Chi phí trung bình một vi phạm dữ liệu tại Mỹ theo báo cáo IBM 2024 là bao nhiêu?",
    opts: ["$4.45 triệu", "$6.72 triệu", "$9.36 triệu", "$12.9 triệu"],
    correct: 2,
    exp: "Theo IBM Cost of Data Breach Report 2024, chi phí trung bình một vi phạm dữ liệu tại Mỹ là $9.36 triệu. Con số $12.9M là chi phí 'không làm gì' theo Gartner."
  },
  {
    q: "Rủi ro nào sau đây KHÔNG thuộc Top 5 rủi ro khi không có Data Governance?",
    opts: [
      "Quyết định thiếu chính xác do dữ liệu không nhất quán",
      "Chi phí hạ tầng công nghệ tăng quá cao",
      "Vi phạm tuân thủ với mức phạt nặng nề",
      "Dự án AI đình trệ do dữ liệu không đáng tin cậy"
    ],
    correct: 1,
    exp: "5 rủi ro hàng đầu: Quyết định thiếu chính xác, Vi phạm tuân thủ, Rò rỉ/vi phạm dữ liệu, Tăng chi phí vận hành (nhân sự lãng phí), Dự án AI đình trệ. 'Chi phí hạ tầng công nghệ tăng' không nằm trong danh sách này."
  }
];

// State
let current = 0, selected = null, submitted = false, score = 0, answers = [];
const labels = ["A","B","C","D"];

function render() {
  const q = questions[current];
  document.getElementById("counter").textContent = `${current+1} / ${questions.length}`;
  document.getElementById("progress-fill").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("score-live").textContent = score;
  document.getElementById("q-num").textContent = String(current+1).padStart(2,"0");
  document.getElementById("q-text").textContent = q.q;
  document.getElementById("explanation-box").style.display = "none";

  const btn = document.getElementById("action-btn");
  btn.textContent = "Xác nhận";
  btn.disabled = true;
  btn.classList.remove("next");
  btn.onclick = handleSubmit;

  // Options
  const container = document.getElementById("options");
  container.innerHTML = "";
  q.opts.forEach((opt, idx) => {
    const b = document.createElement("button");
    b.className = "opt-btn";
    b.innerHTML = `<span class="opt-label">${labels[idx]}</span><span>${opt}</span>`;
    b.onclick = () => select(idx);
    container.appendChild(b);
  });
}

function select(idx) {
  if (submitted) return;
  selected = idx;
  document.querySelectorAll(".opt-btn").forEach((b,i) => {
    b.classList.toggle("selected", i === idx);
  });
  document.getElementById("action-btn").disabled = false;
}

function handleSubmit() {
  if (selected === null || submitted) return;
  submitted = true;
  const q = questions[current];
  const isCorrect = selected === q.correct;
  if (isCorrect) score++;
  answers.push({ selected, correct: q.correct, isCorrect });

  // Style options
  document.querySelectorAll(".opt-btn").forEach((b,i) => {
    b.disabled = true;
    b.classList.remove("selected");
    if (i === q.correct) b.classList.add("correct");
    else if (i === selected && !isCorrect) b.classList.add("wrong");
  });

  // Explanation
  const box = document.getElementById("explanation-box");
  document.getElementById("exp-icon").textContent = isCorrect ? "✅" : "❌";
  document.getElementById("exp-text").textContent = q.exp;
  box.style.display = "flex";

  // Next button
  const btn = document.getElementById("action-btn");
  btn.disabled = false;
  btn.classList.add("next");
  btn.textContent = current+1 >= questions.length ? "Xem kết quả →" : "Câu tiếp theo →";
  btn.onclick = handleNext;
}

function handleNext() {
  if (current+1 >= questions.length) {
    showResult();
  } else {
    current++;
    selected = null;
    submitted = false;
    render();
  }
}

function showResult() {
  showScreen("screen-result");
  const pct = Math.round((score/questions.length)*100);
  const grade = pct>=80?"Xuất sắc":pct>=65?"Khá":pct>=50?"Trung bình":"Cần ôn tập";
  const color = pct>=80?"#f0b429":pct>=65?"#c8911a":pct>=50?"#8a7040":"#e8445a";
  const emoji = pct>=80?"🏆":pct>=65?"🎯":pct>=50?"📘":"📖";

  document.getElementById("result-emoji").textContent = emoji;
  document.getElementById("result-score").textContent = `${score}/${questions.length}`;
  document.getElementById("result-score").style.color = color;

  const tag = document.getElementById("grade-tag");
  tag.textContent = `${grade} — ${pct}%`;
  tag.style.color = color;
  tag.style.borderColor = color;
  tag.style.background = color+"22";

  const grid = document.getElementById("result-grid");
  grid.innerHTML = answers.map((a,i)=>
    `<div class="dot-cell" style="background:${a.isCorrect?"#f0b429":"#e8445a"};color:${a.isCorrect?"#1a1200":"#fff"}" title="Câu ${i+1}">${i+1}</div>`
  ).join("");
}

function showReview() {
  showScreen("screen-review");
  const content = document.getElementById("review-content");
  content.innerHTML = questions.map((q,qi)=>{
    const ans = answers[qi];
    const numColor = ans.isCorrect ? "#f0b429" : "#e8445a";
    const optsHtml = q.opts.map((opt,oi)=>{
      const isCorrect = oi === ans.correct;
      const isWrong = oi === ans.selected && !ans.isCorrect;
      let bg="transparent", border="transparent", color="#8899aa", prefix="　";
      if(isCorrect){bg="rgba(240,180,41,0.11)";border="#f0b429";color="#f0b429";prefix="✓ ";}
      else if(isWrong){bg="rgba(232,68,90,0.12)";border="#e8445a";color="#e8445a";prefix="✗ ";}
      return `<div class="review-opt" style="background:${bg};border-color:${border};color:${color}">${prefix}${opt}</div>`;
    }).join("");
    return `
      <div class="review-item">
        <div class="review-q">
          <div class="r-num" style="background:${numColor}">${qi+1}</div>
          <span>${q.q}</span>
        </div>
        ${optsHtml}
        <div class="review-exp">💡 ${q.exp}</div>
      </div>`;
  }).join("");
}

function backToResult() { showScreen("screen-result"); }

function restart() {
  current=0; selected=null; submitted=false; score=0; answers=[];
  showScreen("screen-quiz");
  render();
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// Init
render();
</script>
