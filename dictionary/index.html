<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Từ Điển Thuật Ngữ & Văn Bản Pháp Luật — DGNA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--gold-l:#E8C97A;--gold-d:#7A6228;--black:#0E0E0E;--g900:#1A1A1A;--g800:#242424;--g700:#333333;--g600:#4A4A4A;--g500:#666666;--g400:#888888;--g300:#AAAAAA;--g200:#CCCCCC;--white:#FAFAF8;--r:6px;--rl:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--black);color:var(--white);min-height:100vh;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1300px;margin:0 auto;padding:0 2rem}
/* Header */
header{padding:2.5rem 0 1.75rem;border-bottom:1px solid var(--g800)}
.hdr-top{display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem}
.brand-mark{width:38px;height:38px;border:1.5px solid var(--gold);display:grid;place-items:center;font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:.06em;flex-shrink:0}
.brand-name{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--g400)}
.hero-title{font-family:'DM Serif Display',serif;font-size:clamp(1.8rem,4.5vw,3rem);line-height:1.08;letter-spacing:-.02em}
.hero-title em{color:var(--gold);font-style:italic}
.hero-sub{margin-top:.6rem;font-size:12px;color:var(--g400);font-family:'DM Mono',monospace;letter-spacing:.04em;display:flex;gap:1.25rem;flex-wrap:wrap}
.hero-sub span::before{content:'— '}
/* Tab nav */
.tab-nav{position:sticky;top:0;z-index:60;background:rgba(14,14,14,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--g800)}
.tab-nav-inner{max-width:1300px;margin:0 auto;padding:0 2rem;display:flex}
.tab-btn{padding:.85rem 1.4rem;font-family:'Outfit',sans-serif;font-size:13px;font-weight:500;color:var(--g400);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .18s;white-space:nowrap}
.tab-btn:hover{color:var(--white)}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-count{display:inline-block;font-size:10px;font-family:'DM Mono',monospace;background:var(--g800);color:var(--g400);border-radius:10px;padding:1px 6px;margin-left:5px}
.tab-btn.active .tab-count{background:rgba(201,168,76,.15);color:var(--gold)}
/* Controls */
.controls-bar{background:var(--g900);border-bottom:1px solid var(--g800);padding:.7rem 0}
.controls-inner{max-width:1300px;margin:0 auto;padding:0 2rem;display:flex;gap:.55rem;align-items:center;flex-wrap:wrap}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--g400);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.search-inp{width:100%;padding:7px 10px 7px 32px;background:var(--g800);border:1px solid var(--g700);border-radius:var(--r);color:var(--white);font-family:'Outfit',sans-serif;font-size:13px;outline:none;transition:border-color .2s}
.search-inp:focus{border-color:var(--gold)}
.search-inp::placeholder{color:var(--g600)}
.pills{display:flex;gap:.35rem;flex-wrap:wrap}
.pill{padding:4px 11px;border-radius:999px;font-size:11px;font-weight:500;letter-spacing:.03em;cursor:pointer;transition:all .15s;user-select:none;border:1px solid var(--g700);color:var(--g400);background:transparent;font-family:'Outfit',sans-serif}
.pill:hover{border-color:var(--g400);color:var(--white)}
.pill.active{background:var(--gold);border-color:var(--gold);color:var(--black)}
.pill.pl.active{background:#2D7A4F;border-color:#2D7A4F;color:#fff}
.pill.pn.active{background:#185FA5;border-color:#185FA5;color:#fff}
.pill.pq.active{background:#8A5C00;border-color:#8A5C00;color:#fff}
.pill.pnq.active{background:#8B1A1A;border-color:#8B1A1A;color:#fff}
.cnt-lbl{margin-left:auto;font-size:11px;color:var(--g500);font-family:'DM Mono',monospace;white-space:nowrap}
/* Panels */
.tab-panel{display:none}
.tab-panel.active{display:block}
/* Term groups */
main{padding:2rem 0 5rem}
.group-block{margin-bottom:2.75rem;animation:fadeUp .35s ease both}
.group-block:nth-child(1){animation-delay:.04s}.group-block:nth-child(2){animation-delay:.08s}
.group-block:nth-child(3){animation-delay:.12s}.group-block:nth-child(4){animation-delay:.16s}
.group-block:nth-child(5){animation-delay:.2s}.group-block:nth-child(6){animation-delay:.24s}
.group-header{display:flex;align-items:center;gap:.7rem;margin-bottom:.9rem;padding-bottom:.55rem;border-bottom:1px solid var(--g800)}
.gdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.gdot.vb{background:#4CAF84}.gdot.nb{background:#5BA8E8}.gdot.qd{background:var(--gold)}.gdot.cd{background:#E57373}
.gtitle{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--g400)}
.gcnt{margin-left:auto;font-family:'DM Mono',monospace;font-size:10px;color:var(--g600)}
.expired-badge{font-size:9px;font-family:'DM Mono',monospace;color:#E57373;border:1px solid rgba(229,115,115,.25);padding:1px 6px;border-radius:3px;margin-left:.5rem}
/* Cards */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:1px;background:var(--g800);border:1px solid var(--g800);border-radius:var(--rl);overflow:hidden}
.card{background:var(--g900);padding:1.2rem 1.35rem;cursor:pointer;transition:background .13s}
.card:hover,.card.expanded{background:var(--g800)}
.card-top{display:flex;gap:.6rem;align-items:flex-start}
.card-src{font-family:'DM Mono',monospace;font-size:9px;color:var(--g600);letter-spacing:.06em;flex-shrink:0;margin-top:4px;min-width:56px}
.card-names{flex:1}
.card-vn{font-size:14px;font-weight:500;color:var(--white);line-height:1.3}
.card-xi{width:15px;height:15px;flex-shrink:0;color:var(--g600);transition:transform .2s,color .15s;margin-top:4px}
.card.expanded .card-xi{transform:rotate(45deg);color:var(--gold)}
.card-body{max-height:0;overflow:hidden;transition:max-height .3s ease,opacity .25s;opacity:0}
.card.expanded .card-body{max-height:600px;opacity:1}
.card-body-inner{padding-top:.85rem;border-top:1px solid var(--g800);margin-top:.85rem}
.desc{font-size:12.5px;color:var(--g200);line-height:1.75;margin-bottom:.8rem}
.mrows{display:flex;flex-direction:column;gap:.35rem}
.mrow{display:flex;gap:.6rem;align-items:flex-start}
.mlbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--g600);width:58px;flex-shrink:0;padding-top:2px}
.mval{font-size:12px;color:var(--g300);line-height:1.5}
.mval.src-law{color:var(--gold-l)}
.mval.src-note{font-style:italic;color:var(--g500)}
/* Law cards */
.laws-panel{padding:2rem 0 5rem}
.law-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:1px;background:var(--g800);border:1px solid var(--g800);border-radius:var(--rl);overflow:hidden;margin-bottom:2.75rem}
.law-card{background:var(--g900);padding:1.2rem 1.35rem;cursor:pointer;transition:background .13s}
.law-card:hover,.law-card.expanded{background:var(--g800)}
.law-card-top{display:flex;gap:.7rem;align-items:flex-start}
.law-type-badge{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;padding:3px 8px;border-radius:3px;flex-shrink:0;align-self:flex-start;margin-top:3px;letter-spacing:.05em}
.lt-luat{background:rgba(45,122,79,.18);color:#4CAF84;border:1px solid rgba(45,122,79,.3)}
.lt-ndcp{background:rgba(25,95,165,.18);color:#5BA8E8;border:1px solid rgba(25,95,165,.3)}
.lt-qd{background:rgba(201,168,76,.12);color:var(--gold);border:1px solid rgba(201,168,76,.25)}
.lt-nq{background:rgba(192,57,43,.15);color:#E57373;border:1px solid rgba(192,57,43,.25)}
.lt-other{background:var(--g800);color:var(--g400);border:1px solid var(--g700)}
.law-info{flex:1}
.law-so{font-family:'DM Mono',monospace;font-size:10px;color:var(--g500);margin-bottom:3px;letter-spacing:.06em;display:flex;align-items:center;flex-wrap:wrap;gap:.4rem}
.law-title{font-size:13.5px;font-weight:500;color:var(--white);line-height:1.35;margin-bottom:4px}
.law-organ{font-size:11px;color:var(--g500)}
.law-xi{width:15px;height:15px;flex-shrink:0;color:var(--g600);transition:transform .2s,color .15s;margin-top:4px}
.law-card.expanded .law-xi{transform:rotate(45deg);color:var(--gold)}
.law-body{max-height:0;overflow:hidden;transition:max-height .35s ease,opacity .25s;opacity:0}
.law-card.expanded .law-body{max-height:500px;opacity:1}
.law-body-inner{padding-top:.85rem;border-top:1px solid var(--g800);margin-top:.85rem}
.law-desc{font-size:12.5px;color:var(--g200);line-height:1.7;margin-bottom:.8rem}
.law-link{display:inline-flex;align-items:center;gap:.4rem;font-size:11px;color:var(--gold);text-decoration:none;font-family:'DM Mono',monospace;padding:4px 9px;border:1px solid rgba(201,168,76,.25);border-radius:4px;transition:all .15s}
.law-link:hover{background:rgba(201,168,76,.08);border-color:var(--gold)}
.law-link svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eff-tag{font-family:'DM Mono',monospace;font-size:9px;border-radius:3px;padding:2px 6px}
.eff-tag.active{background:rgba(76,175,132,.1);color:#4CAF84;border:1px solid rgba(76,175,132,.2)}
.eff-tag.expired{background:rgba(229,115,115,.1);color:#E57373;border:1px solid rgba(229,115,115,.2)}
.eff-tag.unknown{background:var(--g800);color:var(--g500);border:1px solid var(--g700)}
/* Sec header (laws) */
.sec-hdr{display:flex;align-items:center;gap:.7rem;margin-bottom:.9rem;padding-bottom:.55rem;border-bottom:1px solid var(--g800)}
.sec-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sec-luat{background:#4CAF84}.sec-ndcp{background:#5BA8E8}.sec-qd{background:var(--gold)}.sec-nq{background:#E57373}
.sec-title{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--g400)}
.sec-cnt{margin-left:auto;font-family:'DM Mono',monospace;font-size:10px;color:var(--g600)}
/* Misc */
.empty{text-align:center;padding:4rem 2rem;display:none}
.empty.show{display:block}
.empty-ico{font-size:2rem;opacity:.35;margin-bottom:.65rem}
.empty-msg{color:var(--g600);font-size:13px}
footer{border-top:1px solid var(--g800);padding:1.5rem 0}
.footer-inner{max-width:1300px;margin:0 auto;padding:0 2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem}
.footer-brand{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--g600)}
.footer-note{font-size:11px;color:var(--g700)}
#top-btn{position:fixed;bottom:1.75rem;right:1.75rem;width:38px;height:38px;z-index:100;background:var(--g800);border:1px solid var(--g700);border-radius:50%;cursor:pointer;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .2s}
#top-btn.show{opacity:1;pointer-events:all}
#top-btn:hover{background:var(--g700)}
#top-btn svg{width:14px;height:14px;stroke:var(--g400);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
mark{background:rgba(201,168,76,.22);color:var(--gold-l);border-radius:2px;padding:0 1px}
@media(max-width:640px){.wrap,.controls-inner,.footer-inner,.tab-nav-inner{padding:0 1rem}header{padding:1.75rem 0 1.25rem}.cards-grid,.law-grid{grid-template-columns:1fr}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="hdr-top"><div class="brand-mark">DG</div><div class="brand-name">DGNA.VN</div></div>
  <h1 class="hero-title">Từ Điển <em>Dữ Liệu</em> &amp; Văn Bản Pháp Luật</h1>
  <div class="hero-sub"><span id="stat-t">-- thuật ngữ</span><span id="stat-l">-- văn bản</span><span>Pháp luật Việt Nam • DAMA-DMBOK</span></div>
</header>
</div>

<div class="tab-nav">
  <div class="tab-nav-inner">
    <button class="tab-btn active" onclick="switchTab('terms',this)">Thuật ngữ <span class="tab-count" id="tc-t">--</span></button>
    <button class="tab-btn" onclick="switchTab('laws',this)">Văn bản pháp luật <span class="tab-count" id="tc-l">--</span></button>
  </div>
</div>

<div class="controls-bar">
  <div class="controls-inner">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" class="search-inp" type="text" placeholder="Tìm kiếm...">
    </div>
    <div class="pills" id="pt">
      <button class="pill active" data-src="all">Tất cả</button>
      <button class="pill" data-src="91/2025/QH15">Luật BVDLCN</button>
      <button class="pill" data-src="60/2024/QH15">Luật Dữ liệu</button>
      <button class="pill" data-src="278/2025/NĐ-CP">NĐ 278/2025</button>
      <button class="pill" data-src="47/2020/NĐ-CP">NĐ 47/2020</button>
      <button class="pill" data-src="20/2023/QH15">Luật GDĐT</button>
    </div>
    <div class="pills" id="pl" style="display:none">
      <button class="pill active" data-lt="all">Tất cả</button>
      <button class="pill pl" data-lt="Luật">Luật</button>
      <button class="pill pn" data-lt="Nghị định">Nghị định</button>
      <button class="pill pq" data-lt="Quyết định">Quyết định</button>
      <button class="pill pnq" data-lt="Nghị quyết">Nghị quyết</button>
    </div>
    <span class="cnt-lbl" id="cnt">-- mục</span>
  </div>
</div>

<div class="tab-panel active" id="panel-terms">
  <div class="wrap"><main id="tc"></main><div class="empty" id="et"><div class="empty-ico">◎</div><p class="empty-msg">Không tìm thấy kết quả</p></div></div>
</div>
<div class="tab-panel" id="panel-laws">
  <div class="wrap"><div class="laws-panel" id="lc"></div><div class="empty" id="el"><div class="empty-ico">◎</div><p class="empty-msg">Không tìm thấy kết quả</p></div></div>
</div>

<footer>
  <div class="footer-inner">
    <span class="footer-brand">DGNA.VN — Data Governance &amp; Architecture Vietnam</span>
    <span class="footer-note">Luật DL 60/2024 · Luật BVDLCN 91/2025 · NĐ 278/2025 · NĐ 47/2020 · QĐ 2439/QĐ-TTg</span>
  </div>
</footer>
<button id="top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})"><svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg></button>

<script>
const T=[
  {s:"60/2024/QH15",v:"Dữ liệu số",d:"Dữ liệu về sự vật, hiện tượng, sự kiện, bao gồm một hoặc kết hợp các dạng âm thanh, hình ảnh, chữ số, chữ viết, ký hiệu được thể hiện dưới dạng kỹ thuật số.",n:""},
  {s:"60/2024/QH15",v:"Dữ liệu dùng chung",d:"Dữ liệu được tiếp cận, chia sẻ, khai thác, sử dụng chung trong các cơ quan Đảng, Nhà nước, Ủy ban Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị - xã hội.",n:""},
  {s:"60/2024/QH15",v:"Dữ liệu dùng riêng",d:"Dữ liệu được tiếp cận, chia sẻ, khai thác, sử dụng trong phạm vi nội bộ của cơ quan Đảng, Nhà nước, Ủy ban Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị - xã hội.",n:""},
  {s:"60/2024/QH15",v:"Dữ liệu mở",d:"Dữ liệu mà mọi cơ quan, tổ chức, cá nhân có nhu cầu đều được tiếp cận, chia sẻ, khai thác, sử dụng.",n:""},
  {s:"60/2024/QH15",v:"Dữ liệu gốc",d:"Dữ liệu được tạo lập trong quá trình hoạt động của cơ quan, tổ chức, cá nhân hoặc thu thập, tạo lập từ số hóa bản chính giấy tờ, tài liệu, các dạng vật chất khác.",n:""},
  {s:"60/2024/QH15",v:"Dữ liệu quan trọng",d:"Dữ liệu có thể tác động đến quốc phòng, an ninh, đối ngoại, kinh tế vĩ mô, ổn định xã hội, sức khỏe và an toàn cộng đồng thuộc danh mục do Thủ tướng Chính phủ ban hành.",n:""},
  {s:"60/2024/QH15",v:"Dữ liệu cốt lõi",d:"Dữ liệu quan trọng trực tiếp tác động đến quốc phòng, an ninh, đối ngoại, kinh tế vĩ mô, ổn định xã hội, sức khỏe và an toàn cộng đồng thuộc danh mục do Thủ tướng Chính phủ ban hành.",n:""},
  {s:"60/2024/QH15",v:"Xử lý dữ liệu",d:"Quá trình tiếp nhận, chuyển đổi, tổ chức dữ liệu và các hoạt động khác về dữ liệu để phục vụ hoạt động của cơ quan, tổ chức, cá nhân.",n:""},
  {s:"60/2024/QH15",v:"Cơ sở dữ liệu",d:"Tập hợp các dữ liệu được sắp xếp, tổ chức để truy cập, khai thác, chia sẻ, quản lý và cập nhật.",n:""},
  {s:"60/2024/QH15",v:"Cơ sở dữ liệu tổng hợp quốc gia",d:"Cơ sở dữ liệu được tổng hợp từ cơ sở dữ liệu quốc gia, cơ sở dữ liệu chuyên ngành và cơ sở dữ liệu khác.",n:""},
  {s:"60/2024/QH15",v:"Nền tảng chia sẻ, điều phối dữ liệu",d:"Hạ tầng kết nối, tích hợp, chia sẻ và điều phối dữ liệu giữa Trung tâm dữ liệu quốc gia với các cơ quan, tổ chức, cá nhân.",n:""},
  {s:"60/2024/QH15",v:"Chủ thể dữ liệu",d:"Cơ quan, tổ chức, cá nhân được dữ liệu phản ánh.",n:""},
  {s:"60/2024/QH15",v:"Chủ quản dữ liệu",d:"Cơ quan, tổ chức, cá nhân thực hiện hoạt động xây dựng, quản lý, vận hành, khai thác dữ liệu theo yêu cầu của chủ sở hữu dữ liệu.",n:""},
  {s:"60/2024/QH15",v:"Chủ sở hữu dữ liệu",d:"Cơ quan, tổ chức, cá nhân có quyền quyết định việc xây dựng, phát triển, bảo vệ, quản trị, xử lý, sử dụng và trao đổi giá trị của dữ liệu do mình sở hữu.",n:""},
  {s:"60/2024/QH15",v:"Mã hoá dữ liệu",d:"Việc áp dụng các phương pháp, thuật toán mã hóa hoặc giải pháp kỹ thuật để chuyển đổi dữ liệu từ định dạng nhận biết được sang định dạng không nhận biết được.",n:""},
  {s:"60/2024/QH15",v:"Giải mã dữ liệu",d:"Việc áp dụng các phương pháp, thuật toán mã hóa hoặc giải pháp kỹ thuật để chuyển đổi dữ liệu được mã hóa từ định dạng không nhận biết được sang định dạng nhận biết được.",n:""},
  {s:"60/2024/QH15",v:"Điều phối dữ liệu",d:"Hoạt động tổ chức điều động và phân phối dữ liệu, quản lý, giám sát, tối ưu hóa luồng dữ liệu chia sẻ giữa các hệ thống thông tin, cơ sở dữ liệu.",n:""},
  {s:"91/2025/QH15",v:"Dữ liệu cá nhân",d:"Dữ liệu số hoặc thông tin dưới dạng khác xác định hoặc giúp xác định một con người cụ thể, bao gồm: dữ liệu cá nhân cơ bản và dữ liệu cá nhân nhạy cảm. Dữ liệu cá nhân sau khi khử nhận dạng không còn là dữ liệu cá nhân.",n:"Thay thế định nghĩa tại NĐ 13/2023/NĐ-CP"},
  {s:"91/2025/QH15",v:"Dữ liệu cá nhân cơ bản",d:"Dữ liệu cá nhân phản ánh các yếu tố nhân thân, lai lịch phổ biến, thường xuyên sử dụng trong các giao dịch, quan hệ xã hội, thuộc danh mục do Chính phủ ban hành.",n:""},
  {s:"91/2025/QH15",v:"Dữ liệu cá nhân nhạy cảm",d:"Dữ liệu cá nhân gắn liền với quyền riêng tư của cá nhân, khi bị xâm phạm sẽ gây ảnh hưởng trực tiếp đến quyền, lợi ích hợp pháp của cơ quan, tổ chức, cá nhân, thuộc danh mục do Chính phủ ban hành.",n:""},
  {s:"91/2025/QH15",v:"Bảo vệ dữ liệu cá nhân",d:"Việc cơ quan, tổ chức, cá nhân sử dụng lực lượng, phương tiện, biện pháp để phòng, chống hoạt động xâm phạm dữ liệu cá nhân.",n:""},
  {s:"91/2025/QH15",v:"Chủ thể dữ liệu cá nhân",d:"Người được dữ liệu cá nhân phản ánh.",n:""},
  {s:"91/2025/QH15",v:"Xử lý dữ liệu cá nhân",d:"Hoạt động tác động đến dữ liệu cá nhân, bao gồm một hoặc nhiều hoạt động như: thu thập, phân tích, tổng hợp, mã hóa, giải mã, chỉnh sửa, xóa, hủy, khử nhận dạng, cung cấp, công khai, chuyển giao dữ liệu cá nhân và hoạt động khác tác động đến dữ liệu cá nhân.",n:""},
  {s:"91/2025/QH15",v:"Bên kiểm soát dữ liệu cá nhân",d:"Cơ quan, tổ chức, cá nhân quyết định mục đích và phương tiện xử lý dữ liệu cá nhân.",n:""},
  {s:"91/2025/QH15",v:"Bên xử lý dữ liệu cá nhân",d:"Cơ quan, tổ chức, cá nhân thực hiện việc xử lý dữ liệu cá nhân theo yêu cầu của bên kiểm soát dữ liệu cá nhân hoặc bên kiểm soát và xử lý dữ liệu cá nhân thông qua hợp đồng.",n:""},
  {s:"91/2025/QH15",v:"Bên kiểm soát và xử lý dữ liệu cá nhân",d:"Cơ quan, tổ chức, cá nhân quyết định mục đích, phương tiện và trực tiếp xử lý dữ liệu cá nhân.",n:""},
  {s:"91/2025/QH15",v:"Bên thứ ba",d:"Tổ chức, cá nhân ngoài chủ thể dữ liệu cá nhân, bên kiểm soát, bên kiểm soát và xử lý, bên xử lý dữ liệu cá nhân tham gia vào việc xử lý dữ liệu cá nhân theo quy định của pháp luật.",n:""},
  {s:"91/2025/QH15",v:"Khử nhận dạng dữ liệu cá nhân",d:"Quá trình thay đổi hoặc xóa thông tin để tạo ra dữ liệu mới không thể xác định hoặc không thể giúp xác định được một con người cụ thể.",n:""},
  {s:"91/2025/QH15",v:"Đánh giá tác động xử lý dữ liệu cá nhân",d:"Việc phân tích, đánh giá rủi ro có thể xảy ra trong quá trình xử lý dữ liệu cá nhân để áp dụng các biện pháp giảm thiểu rủi ro, bảo vệ dữ liệu cá nhân.",n:""},
  {s:"278/2025/NĐ-CP",v:"Dữ liệu chủ quốc gia",d:"Dữ liệu chủ được kết nối, chia sẻ, khai thác, sử dụng chung trong các cơ quan Đảng, Nhà nước, Ủy ban Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị - xã hội.",n:""},
  {s:"278/2025/NĐ-CP",v:"Dữ liệu chủ chuyên ngành",d:"Dữ liệu chủ được kết nối, chia sẻ, khai thác, sử dụng trong phạm vi nội bộ của cơ quan Đảng, Nhà nước, Ủy ban Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị - xã hội.",n:""},
  {s:"278/2025/NĐ-CP",v:"Kiểm toán dữ liệu",d:"Quá trình đánh giá một cách hệ thống, độc lập và khách quan đối với dữ liệu và hoạt động quản lý, khai thác dữ liệu nhằm bảo đảm tính đầy đủ, chính xác, kịp thời, hợp pháp, bảo mật và khả năng truy xuất của dữ liệu trong toàn bộ vòng đời dữ liệu.",n:""},
  {s:"278/2025/NĐ-CP",v:"Từ điển dữ liệu dùng chung",d:"Hệ thống tài liệu và công cụ kỹ thuật định nghĩa thống nhất tên gọi, mô tả, định dạng, đơn vị tính, mối liên kết và cách sử dụng của các trường dữ liệu được sử dụng phổ biến giữa các cơ quan, tổ chức trong hệ thống chính trị nhằm bảo đảm kết nối, liên thông và chia sẻ dữ liệu hiệu quả.",n:""},
  {s:"278/2025/NĐ-CP",v:"Kết nối, chia sẻ dữ liệu bắt buộc",d:"Việc thiết lập kết nối kỹ thuật bắt buộc giữa các hệ thống thông tin, cơ sở dữ liệu trong hệ thống chính trị nhằm chia sẻ, khai thác và sử dụng dữ liệu đã được phân quyền theo quy định, không phụ thuộc vào thỏa thuận riêng giữa các cơ quan, tổ chức.",n:""},
  {s:"278/2025/NĐ-CP",v:"Mã khóa định danh (data key)",d:"Những điểm dữ liệu đặc biệt giúp định danh chính xác một đối tượng cụ thể, chuẩn hóa cơ chế chống trùng lặp; được chuẩn hóa định dạng, mã hóa, mô tả và phân loại thống nhất; bảo đảm khả năng mở rộng, tích hợp, liên thông.",n:""},
  {s:"47/2020/NĐ-CP",v:"Dữ liệu số",d:"Dữ liệu dưới dạng ký hiệu, chữ viết, chữ số, hình ảnh, âm thanh hoặc dạng tương tự được biểu diễn bằng tín hiệu số. Dữ liệu số mang thông tin số và được chia sẻ dưới dạng thông điệp dữ liệu.",n:"Định nghĩa theo NĐ 47/2020"},
  {s:"47/2020/NĐ-CP",v:"Cấu trúc dữ liệu trao đổi",d:"Cấu trúc của thông điệp dữ liệu được trao đổi giữa các hệ thống thông tin, cơ sở dữ liệu.",n:""},
  {s:"47/2020/NĐ-CP",v:"Dịch vụ chia sẻ dữ liệu",d:"Các dịch vụ cung cấp, chia sẻ dữ liệu cho cơ quan, tổ chức, cá nhân khai thác hoặc thu nhận dữ liệu từ các cơ quan, tổ chức, cá nhân qua các hệ thống thông tin.",n:""},
  {s:"47/2020/NĐ-CP",v:"Dữ liệu mở của cơ quan nhà nước",d:"Dữ liệu được cơ quan nhà nước có thẩm quyền công bố rộng rãi cho cơ quan, tổ chức, cá nhân tự do sử dụng, tái sử dụng, chia sẻ.",n:""},
  {s:"47/2020/NĐ-CP",v:"Chia sẻ dữ liệu mặc định",d:"Hình thức chia sẻ các dữ liệu thường xuyên trong cơ quan nhà nước theo quy trình đơn giản, trong đó cơ quan nhà nước chuẩn bị sẵn các dịch vụ chia sẻ dữ liệu và cung cấp dữ liệu đã được chuẩn hóa cấu trúc dữ liệu trao đổi thông qua dịch vụ chia sẻ dữ liệu cho nhiều cơ quan nhà nước sử dụng.",n:""},
  {s:"47/2020/NĐ-CP",v:"Chia sẻ dữ liệu theo yêu cầu đặc thù",d:"Hình thức chia sẻ dữ liệu cho cơ quan nhà nước khác sử dụng theo yêu cầu riêng đối với dữ liệu không được sử dụng thông dụng bởi nhiều cơ quan nhà nước khác nhau; việc chia sẻ dữ liệu theo hình thức này cần thực hiện các hoạt động phối hợp của các bên về mặt kỹ thuật.",n:""},
  {s:"47/2020/NĐ-CP",v:"Dữ liệu danh mục dùng chung",d:"Dữ liệu về các danh mục, bảng mã phân loại do cơ quan nhà nước có thẩm quyền ban hành, được sử dụng chung trong các hệ thống thông tin, cơ sở dữ liệu bảo đảm việc tích hợp, trao đổi, chia sẻ dữ liệu đồng bộ, thống nhất.",n:""},
  {s:"47/2020/NĐ-CP",v:"Định dạng mở",d:"Định dạng của tập tin hoặc thông điệp dữ liệu được quy định theo công bố kỹ thuật của tổ chức hoạt động về tiêu chuẩn và không bị hạn chế khi sử dụng công bố kỹ thuật này.",n:""},
  {s:"47/2020/NĐ-CP",v:"Dữ liệu chủ (master data)",d:"Dữ liệu chứa thông tin cơ bản nhất để định danh và mô tả các đối tượng thực thể nghiệp vụ cốt lõi và độc lập.",n:""},
  {s:"47/2020/NĐ-CP",v:"Cổng dữ liệu quốc gia",d:"Điểm đầu mối truy cập thông tin, dữ liệu có địa chỉ data.gov.vn trên mạng Internet phục vụ việc công bố dữ liệu mở, cung cấp thông tin về chia sẻ dữ liệu của cơ quan nhà nước.",n:""},
  {s:"20/2023/QH15",v:"Giao dịch điện tử",d:"Giao dịch được thực hiện bằng phương tiện điện tử.",n:""},
  {s:"20/2023/QH15",v:"Phương tiện điện tử",d:"Phần cứng, phần mềm, hệ thống thông tin hoặc phương tiện khác hoạt động dựa trên công nghệ thông tin, công nghệ điện, điện tử, kỹ thuật số, từ tính, truyền dẫn không dây, quang học, điện từ hoặc công nghệ khác tương tự.",n:""},
  {s:"20/2023/QH15",v:"Môi trường điện tử",d:"Môi trường mạng viễn thông, mạng Internet, mạng máy tính, hệ thống thông tin.",n:""},
  {s:"20/2023/QH15",v:"Thông điệp dữ liệu",d:"Thông tin được tạo ra, được gửi, được nhận, được lưu trữ bằng phương tiện điện tử.",n:""},
  {s:"20/2023/QH15",v:"Chứng thư điện tử",d:"Giấy phép, giấy chứng nhận, chứng chỉ, văn bản xác nhận, văn bản chấp thuận khác do cơ quan, tổ chức có thẩm quyền phát hành dưới dạng dữ liệu điện tử.",n:""},
  {s:"20/2023/QH15",v:"Dữ liệu điện tử",d:"Dữ liệu được tạo ra, xử lý, lưu trữ bằng phương tiện điện tử.",n:""},
  {s:"20/2023/QH15",v:"Dữ liệu chủ",d:"Dữ liệu chứa thông tin cơ bản nhất để mô tả một đối tượng cụ thể, làm cơ sở để tham chiếu, đồng bộ giữa các cơ sở dữ liệu hoặc các tập dữ liệu khác nhau.",n:"Định nghĩa theo Luật GDĐT 2023"},
  {s:"20/2023/QH15",v:"Cơ sở dữ liệu",d:"Tập hợp các dữ liệu điện tử được sắp xếp, tổ chức để truy cập, khai thác, chia sẻ, quản lý và cập nhật thông qua phương tiện điện tử.",n:"Định nghĩa theo Luật GDĐT 2023"},
  {s:"20/2023/QH15",v:"Chữ ký điện tử",d:"Chữ ký được tạo lập dưới dạng dữ liệu điện tử gắn liền hoặc kết hợp một cách lô gíc với thông điệp dữ liệu để xác nhận chủ thể ký và khẳng định sự chấp thuận của chủ thể đó đối với thông điệp dữ liệu.",n:""},
  {s:"20/2023/QH15",v:"Chữ ký số",d:"Chữ ký điện tử sử dụng thuật toán khóa không đối xứng, gồm khóa bí mật và khóa công khai. Chữ ký số bảo đảm tính xác thực, tính toàn vẹn và tính chống chối bỏ nhưng không bảo đảm tính bí mật của thông điệp dữ liệu.",n:""},
  {s:"20/2023/QH15",v:"Hợp đồng điện tử",d:"Hợp đồng được thiết lập dưới dạng thông điệp dữ liệu.",n:""},
  {s:"20/2023/QH15",v:"Dấu thời gian",d:"Dữ liệu điện tử gắn với thông điệp dữ liệu cho phép xác định thời gian của thông điệp dữ liệu đó tồn tại ở một thời điểm cụ thể.",n:""},
  {s:"20/2023/QH15",v:"Người trung gian",d:"Cơ quan, tổ chức, cá nhân đại diện cho cơ quan, tổ chức, cá nhân khác thực hiện việc gửi, nhận hoặc lưu trữ thông điệp dữ liệu hoặc cung cấp dịch vụ khác liên quan đến thông điệp dữ liệu đó.",n:""},
  {s:"169/2025/NĐ-CP",v:"Sản phẩm, dịch vụ về dữ liệu",d:"Sản phẩm, dịch vụ được tạo thành từ dữ liệu hoặc sử dụng dữ liệu là nguồn tài nguyên chính để phát triển, ứng dụng, giao dịch.",n:""},
  {s:"169/2025/NĐ-CP",v:"Hoạt động thử nghiệm có kiểm soát",d:"Việc cơ quan nhà nước cho phép tổ chức, cá nhân thử nghiệm có kiểm soát đối với sản phẩm, dịch vụ về dữ liệu mà chưa có quy định của pháp luật hoặc pháp luật quy định chưa đầy đủ.",n:""},
  {s:"169/2025/NĐ-CP",v:"Rủi ro trong hoạt động thử nghiệm có kiểm soát",d:"Những yếu tố không chắc chắn hoặc bất định có thể gây ra các tác động tiêu cực, làm gián đoạn hoặc ảnh hưởng đến quá trình thực hiện, kết quả đạt được hoặc khả năng ứng dụng của các dự án và sáng kiến.",n:""},
  {s:"169/2025/NĐ-CP",v:"Hoạt động khoa học, công nghệ, đổi mới sáng tạo về dữ liệu",d:"Hoạt động nghiên cứu cơ bản, nghiên cứu ứng dụng, triển khai thực nghiệm, sản xuất thử nghiệm, ứng dụng công nghệ nhằm phát triển khoa học, công nghệ trong xây dựng, phát triển, bảo vệ, quản trị, xử lý, sử dụng dữ liệu và tạo ra giá trị kinh tế gia tăng.",n:""},
  {s:"20/2025/QĐ-TTg",v:"Mã định danh điện tử của các cơ quan, tổ chức",d:"Chuỗi ký tự để phân biệt, xác định duy nhất các cơ quan, tổ chức khi kết nối, chia sẻ dữ liệu với các hệ thống thông tin, cơ sở dữ liệu của các bộ, ngành, địa phương.",n:""},
  {s:"20/2025/QĐ-TTg",v:"Hệ thống mã định danh điện tử",d:"Tập hợp các mã định danh điện tử và các thông tin liên quan của một nhóm cơ quan, tổ chức cụ thể.",n:""},
  {s:"20/2025/QĐ-TTg",v:"Lược đồ định danh",d:"Bảng dữ liệu mô tả hệ thống mã định danh điện tử của một nhóm các cơ quan, tổ chức cụ thể.",n:""},
  {s:"20/2025/QĐ-TTg",v:"Mã xác định lược đồ định danh",d:"Nhóm ký tự để phân biệt, xác định duy nhất lược đồ định danh của một nhóm cơ quan, tổ chức cụ thể.",n:""},
  {s:"20/2025/QĐ-TTg",v:"Mã xác định cơ quan, tổ chức trong lược đồ định danh",d:"Nhóm ký tự để phân biệt, xác định duy nhất cơ quan, tổ chức đó trong một hệ thống mã định danh điện tử được mô tả bởi lược đồ định danh tương ứng.",n:""},

const SRC_ORDER=["91/2025/QH15","60/2024/QH15","278/2025/NĐ-CP","356/2025/NĐ-CP","169/2025/NĐ-CP","47/2020/NĐ-CP","20/2023/QH15","20/2025/QĐ-TTg","13/2023/NĐ-CP"];
const SRC_META={"91/2025/QH15":{label:"Luật BVDLCN 91/2025/QH15",dot:"vb"},"60/2024/QH15":{label:"Luật Dữ liệu 60/2024/QH15",dot:"vb"},"278/2025/NĐ-CP":{label:"NĐ 278/2025 — Kết nối, chia sẻ dữ liệu",dot:"nb"},"356/2025/NĐ-CP":{label:"NĐ 356/2025 — Chi tiết Luật BVDLCN",dot:"nb"},"169/2025/NĐ-CP":{label:"NĐ 169/2025 — Thị trường dữ liệu",dot:"nb"},"47/2020/NĐ-CP":{label:"NĐ 47/2020 — QLKN&CS dữ liệu số",dot:"nb"},"20/2023/QH15":{label:"Luật Giao dịch điện tử 20/2023/QH15",dot:"vb"},"20/2025/QĐ-TTg":{label:"QĐ 20/2025 — Mã định danh điện tử",dot:"qd"},"13/2023/NĐ-CP":{label:"NĐ 13/2023 — BVDLCN (đã hết hiệu lực)",dot:"cd"}};
const LAW_GROUPS=[{k:"Luật",lbl:"Luật",dot:"sec-luat"},{k:"Nghị định",lbl:"Nghị định",dot:"sec-ndcp"},{k:"Quyết định",lbl:"Quyết định",dot:"sec-qd"},{k:"Nghị quyết",lbl:"Nghị quyết",dot:"sec-nq"}];

let tab='terms',src='all',lt='all',q='';

function e(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hl(text,qq){if(!qq)return e(text);return e(text).replace(new RegExp('('+qq.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')}
function lawCls(t){return t==='Luật'?'lt-luat':t==='Nghị định'?'lt-ndcp':t==='Quyết định'?'lt-qd':t==='Nghị quyết'?'lt-nq':'lt-other'}
function effTag(x){return x==='active'?'<span class="eff-tag active">● Còn hiệu lực</span>':x==='expired'?'<span class="eff-tag expired">✕ Hết hiệu lực</span>':'<span class="eff-tag unknown">Chưa rõ</span>'}

function renderTerms(){
  const qq=q.toLowerCase().trim();
  const f=T.filter(t=>{const sm=src==='all'||t.s===src;const tx=(t.v+t.d+t.s+t.n).toLowerCase();return sm&&(!qq||tx.includes(qq))});
  document.getElementById('tc-t').textContent=f.length;
  document.getElementById('cnt').textContent=f.length+' thuật ngữ';
  const cont=document.getElementById('tc'),em=document.getElementById('et');
  if(!f.length){cont.innerHTML='';em.classList.add('show');return}em.classList.remove('show');
  const grp={};SRC_ORDER.forEach(s=>{grp[s]=[]});f.forEach(t=>{if(!grp[t.s])grp[t.s]=[];grp[t.s].push(t)});
  let html='';
  SRC_ORDER.forEach(s=>{
    const items=grp[s];if(!items||!items.length)return;
    const m=SRC_META[s]||{label:s,dot:'nb'};
    const exp=s==='13/2023/NĐ-CP';
    html+=`<div class="group-block"><div class="group-header"><span class="gdot ${m.dot}"></span><span class="gtitle">${e(m.label)}</span>${exp?'<span class="expired-badge">Hết hiệu lực</span>':''}<span class="gcnt">${items.length}</span></div><div class="cards-grid">${items.map(t=>`<div class="card" onclick="this.classList.toggle('expanded')"><div class="card-top"><span class="card-src">${e(t.s)}</span><div class="card-names"><div class="card-vn"${exp?' style="opacity:.65"':''}>${hl(t.v,qq)}</div></div><svg class="card-xi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div><div class="card-body"><div class="card-body-inner"><p class="desc">${hl(t.d,qq)}</p><div class="mrows"><div class="mrow"><span class="mlbl">Nguồn</span><span class="mval src-law">${e(t.s)}</span></div>${t.n?`<div class="mrow"><span class="mlbl">Ghi chú</span><span class="mval src-note">${e(t.n)}</span></div>`:''}</div></div></div></div>`).join('')}</div></div>`;
  });
  cont.innerHTML=html;
}

function renderLaws(){
  const qq=q.toLowerCase().trim();
  const f=L.filter(l=>{const lm=lt==='all'||l.t===lt;const tx=(l.so+l.ti+l.d+l.co+l.t).toLowerCase();return lm&&(!qq||tx.includes(qq))});
  document.getElementById('tc-l').textContent=f.length;
  document.getElementById('cnt').textContent=f.length+' văn bản';
  const cont=document.getElementById('lc'),em=document.getElementById('el');
  if(!f.length){cont.innerHTML='';em.classList.add('show');return}em.classList.remove('show');
  const grp={};f.forEach(l=>{if(!grp[l.t])grp[l.t]=[];grp[l.t].push(l)});
  let html='';
  LAW_GROUPS.forEach(g=>{
    const items=grp[g.k];if(!items||!items.length)return;
    html+=`<div class="group-block"><div class="sec-hdr"><span class="sec-dot ${g.dot}"></span><span class="sec-title">${e(g.lbl)}</span><span class="sec-cnt">${items.length}</span></div><div class="law-grid">${items.map(l=>`<div class="law-card" onclick="this.classList.toggle('expanded')"><div class="law-card-top"><span class="law-type-badge ${lawCls(l.t)}">${e(l.t)}</span><div class="law-info"><div class="law-so">${e(l.so||'Chưa có số')} ${effTag(l.e)}</div><div class="law-title">${hl(l.ti,qq)}</div><div class="law-organ">${e(l.co)} · ${e(l.y)}</div></div><svg class="law-xi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div><div class="law-body"><div class="law-body-inner">${l.d?`<p class="law-desc">${hl(l.d,qq)}</p>`:''}<div style="display:flex;flex-wrap:wrap;gap:.5rem;align-items:center">${l.url?`<a class="law-link" href="${e(l.url)}" target="_blank" rel="noopener">Xem văn bản <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>`:''}</div></div></div></div>`).join('')}</div></div>`;
  });
  cont.innerHTML=html;
}

function render(){if(tab==='terms')renderTerms();else renderLaws()}

function switchTab(newTab,btn){
  tab=newTab;q='';document.getElementById('search').value='';
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));document.getElementById('panel-'+newTab).classList.add('active');
  document.getElementById('pt').style.display=newTab==='terms'?'flex':'none';
  document.getElementById('pl').style.display=newTab==='laws'?'flex':'none';
  if(newTab==='terms'){src='all';document.querySelectorAll('#pt .pill').forEach(p=>p.classList.remove('active'));document.querySelector('#pt .pill[data-src="all"]').classList.add('active')}
  else{lt='all';document.querySelectorAll('#pl .pill').forEach(p=>p.classList.remove('active'));document.querySelector('#pl .pill[data-lt="all"]').classList.add('active')}
  render();
}

document.querySelectorAll('#pt .pill').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('#pt .pill').forEach(b=>b.classList.remove('active'));btn.classList.add('active');src=btn.dataset.src;renderTerms();
}));
document.querySelectorAll('#pl .pill').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('#pl .pill').forEach(b=>b.classList.remove('active'));btn.classList.add('active');lt=btn.dataset.lt;renderLaws();
}));

let st;document.getElementById('search').addEventListener('input',ev=>{clearTimeout(st);st=setTimeout(()=>{q=ev.target.value;render()},160)});
window.addEventListener('scroll',()=>document.getElementById('top-btn').classList.toggle('show',scrollY>400),{passive:true});

document.getElementById('stat-t').textContent=T.length+' thuật ngữ';
document.getElementById('stat-l').textContent=L.length+' văn bản pháp luật';
document.getElementById('tc-t').textContent=T.length;
document.getElementById('tc-l').textContent=L.length;
document.getElementById('cnt').textContent=T.length+' thuật ngữ';
renderTerms();
</script>
</body>
</html>
